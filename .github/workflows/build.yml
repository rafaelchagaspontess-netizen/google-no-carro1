name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Publicar APK no branch "apk"
        run: |
          cp app/build/outputs/apk/release/app-release.apk /tmp/GoogleNoCarro.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk
          git rm -rf . > /dev/null
          cp /tmp/GoogleNoCarro.apk .
          git add GoogleNoCarro.apk
          git commit -m "APK ${GITHUB_SHA}"
          git push -f origin apk
